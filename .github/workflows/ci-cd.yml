name: Iris MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Git user for DVC
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run DVC Pipeline
        run: |
          export DVC_NO_ANALYTICS=1
          dvc repro

      - name: Run Pytest Suite
        run: |
          pytest -v --junitxml=test-reports/junit.xml

      - name: Build Docker Image
        run: |
          docker build -t iris-mlops-api:latest .

      - name: Smoke Test Docker Container
        run: |
          docker run -d --name iris-api -p 8000:8000 iris-mlops-api:latest
          sleep 5
          curl --fail http://localhost:8000/health || exit 1
          docker stop iris-api
