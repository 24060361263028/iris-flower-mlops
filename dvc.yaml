stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
    params:
      - data.raw_path
      - data.train_path
      - data.test_path
      - data.test_size
      - data.random_state
    outs:
      - data/raw/iris.csv
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/train.py
    deps:
      - data/processed/train.csv
      - src/train.py
    params:
      - train.n_estimators
      - train.max_depth
      - train.random_state
      - train.model_path
    outs:
      - models/model.joblib

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - data/processed/test.csv
      - models/model.joblib
      - src/evaluate.py
    metrics:
      - metrics/metrics.json:
          cache: false
